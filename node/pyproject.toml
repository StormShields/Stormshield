[project]
name = "storm-shield-node"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "httpx",
    "rns>=1.5.7",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
storm-shield-node = "storm_shield.main:run"
storm-shield-sandbox = "storm_shield.sandbox:run"
storm-shield-sandbox-app = "storm_shield.sandbox_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storm_shield"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# The Cache Pack build script is not part of the Node, but its routing is tested here.
pythonpath = ["../scripts"]
# Real Reticulum Nodes on fixed ports. Left out by default (and in CI); run them with
# `uv run pytest -m mesh_integration` or the "Mesh integration" workflow.
markers = ["mesh_integration: starts real Node processes over Reticulum"]
addopts = '-m "not mesh_integration"'

[tool.mypy]
strict = true
mypy_path = "../scripts"

[[tool.mypy.overrides]]
module = ["RNS", "RNS.*", "pyrosm"]
ignore_missing_imports = true
